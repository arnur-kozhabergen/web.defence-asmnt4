<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Feedback</title></head>
<body class="container"><h1>Feedback</h1>
  <nav><a href="index.html">Contact</a> <a href="html-validation.html">Validation</a> <a href="bootstrap-form.html">Bootstrap</a> <a href="registration.html">Registration</a></nav>
  <form id="validation-form" class="row g-3" novalidate>
    <div class="col-md-6">
      <label for="feedback-name" class="form-label">Name</label>
      <input id="feedback-name" name="name" class="form-control" required minlength="2">
      <div class="valid-feedback">Looks good!</div>
      <div class="invalid-feedback">Enter a name.</div>
    </div>
    <div class="col-md-6">
      <label for="feedback-email" class="form-label">Email</label>
      <input id="feedback-email" name="email" type="email" class="form-control" required>
      <div class="valid-feedback">Looks good!</div>
      <div class="invalid-feedback">Enter a valid email.</div>
    </div>
    <div class="col-12">
      <label for="feedback-message" class="form-label">Message</label>
      <textarea id="feedback-message" name="message" class="form-control" required minlength="10" maxlength="500"></textarea>
      <div class="form-text">At least 10 characters.</div>
      <div class="valid-feedback">Looks good!</div>
      <div class="invalid-feedback">Write at least 10 characters.</div>
    </div>
    <button class="btn btn-primary" type="submit">Check</button>
  </form>
  <script>
    const form = document.querySelector("#validation-form");
    form.addEventListener("submit", event => {
      event.preventDefault();
      const fields = form.querySelectorAll("input, textarea");
      fields.forEach(field => {
        const valid = field.checkValidity();
        field.classList.toggle("is-valid", valid);
        field.classList.toggle("is-invalid", !valid);
      });
    });
  </script>
</body>
</html>

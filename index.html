<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
  <nav class="nav nav-pills mb-3">
    <a class="nav-link" href="index.html">Contact</a>
    <a class="nav-link" href="html-validation.html">Validation</a>
    <a class="nav-link" href="bootstrap-form.html">Bootstrap</a>
    <a class="nav-link" href="bootstrap-validation.html">Feedback</a>
    <a class="nav-link" href="registration.html">Registration</a>
  </nav>
  <h1 class="mb-3">Forms</h1>
  <main>
    <section id="contact">
      <h2>Contact</h2>
      <form class="row g-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Name</label>
          <input id="name" name="name" type="text" class="form-control">
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control">
        </div>
        <div class="col-12">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" name="message" class="form-control"></textarea>
        </div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Send</button></div>
      </form>
    </section>
  </main>
</body>
</html>

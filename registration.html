<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">
<nav>
  <a href="index.html">Contact</a>
  <a href="html-validation.html">Validation</a>
  <a href="bootstrap-form.html">Bootstrap</a>
  <a href="bootstrap-validation.html">Feedback</a>
  <a href="registration.html">Registration</a>
</nav>
<h1>Registration</h1>
<form id="registration-form" class="row g-3">
<div class="col-md-6"><label for="reg-first" class="form-label">First Name</label>
  <input id="reg-first" name="firstName" class="form-control" required minlength="2"></div>
<div class="col-md-6"><label for="reg-last" class="form-label">Last Name</label>
  <input id="reg-last" name="lastName" class="form-control" required minlength="2"></div>
<div class="col-md-6"><label for="reg-email" class="form-label">Email</label>
  <input id="reg-email" name="email" type="email" class="form-control" required></div>
<div class="col-md-6"><label for="reg-password" class="form-label">Password</label>
  <input id="reg-password" name="password" type="password" class="form-control" required minlength="8"></div>
<div class="col-md-6"><label for="reg-confirm" class="form-label">Confirm Password</label>
  <input id="reg-confirm" name="confirmPassword" type="password" class="form-control" required minlength="8"></div>
<fieldset class="col-md-6">
  <legend class="form-label">Gender</legend>
  <div class="form-check"><input id="gender-female" name="gender" value="female" type="radio" class="form-check-input" required><label for="gender-female" class="form-check-label">Female</label></div>
  <div class="form-check"><input id="gender-male" name="gender" value="male" type="radio" class="form-check-input" required><label for="gender-male" class="form-check-label">Male</label></div>
</fieldset>
<div class="col-12">
  <label class="form-label">Hobbies</label>
  <div class="form-check"><input id="hobby-reading" name="hobbies" value="reading" type="checkbox" class="form-check-input"><label for="hobby-reading" class="form-check-label">Reading</label></div>
  <div class="form-check"><input id="hobby-music" name="hobbies" value="music" type="checkbox" class="form-check-input"><label for="hobby-music" class="form-check-label">Music</label></div>
  <div class="form-check"><input id="hobby-sports" name="hobbies" value="sports" type="checkbox" class="form-check-input"><label for="hobby-sports" class="form-check-label">Sports</label></div>
</div>
<div class="col-md-6"><label for="country" class="form-label">Country</label>
  <select id="country" name="country" class="form-select" required>
    <option value="">Choose...</option><option>Kazakhstan</option><option>Other</option>
  </select></div>
<button class="btn btn-primary" type="submit">Register</button> <button class="btn btn-secondary" type="reset">Reset</button>
</form>
</body></html>

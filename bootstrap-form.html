<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container"><h1>Bootstrap</h1>
  <nav>
    <a href="index.html">Contact</a>
    <a href="html-validation.html">Validation</a>
    <a href="bootstrap-form.html">Bootstrap</a>
    <a href="bootstrap-validation.html">Feedback</a>
    <a href="registration.html">Registration</a>
  </nav>
  <form class="row g-3">
    <div class="col-md-6">
      <label for="boot-name" class="form-label">Name</label>
      <input id="boot-name" name="name" class="form-control" type="text" placeholder="Name">
    </div>
    <div class="col-md-6">
      <label for="boot-email" class="form-label">Email</label>
      <input id="boot-email" name="email" class="form-control" type="email" placeholder="Email">
    </div>
    <div class="col-12">
      <label for="boot-message" class="form-label">Message</label>
      <textarea id="boot-message" name="message" class="form-control" rows="4" placeholder="Message"></textarea>
      <div class="form-text">Write a short message.</div>
    </div>
    <button class="btn btn-primary" type="submit">Send</button></form>
</body></html>
